<!doctype html>
<html lang="en" data-version="{{ app_version }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}L3 &amp; S3 Dashboard{% endblock %} | Line 2</title>
<script>
  // Screen setup, before anything is drawn (see /display-check).
  //  - ?rotate=90 or ?rotate=270 turns the whole page for a portrait screen whose output can't be
  //    rotated (e.g. a digital standee); remembered on that screen. ?rotate=0 switches it off.
  //  - "portrait" class when the (turned) page is taller than wide: station pages then stand the
  //    chassis upright with the boxes left and right.
  (function () {
    var root = document.documentElement, rot = "0", m = /[?&]rotate=(0|90|270)\b/.exec(location.search);
    try {
      if (m) localStorage.setItem("line2-rotate", m[1]);
      rot = localStorage.getItem("line2-rotate") || "0";
    } catch (e) { rot = m ? m[1] : "0"; }
    window.ROTATION = rot === "90" ? 90 : rot === "270" ? 270 : 0;
    if (window.ROTATION) root.className += " rotated rot-" + rot;
    // page size and element positions as the page sees them (also when turned)
    window.viewW = function () { return window.ROTATION ? window.innerHeight : window.innerWidth; };
    window.viewH = function () { return window.ROTATION ? window.innerWidth : window.innerHeight; };
    window.logicalPoint = function (x, y) {
      if (window.ROTATION === 270) return { x: window.innerHeight - y, y: x };
      if (window.ROTATION === 90) return { x: y, y: window.innerWidth - x };
      return { x: x, y: y };
    };
    window.logicalRect = function (el) {
      var r = el.getBoundingClientRect(), a, b;
      if (!window.ROTATION) return r;
      a = window.logicalPoint(r.left, r.top); b = window.logicalPoint(r.right, r.bottom);
      var left = Math.min(a.x, b.x), top = Math.min(a.y, b.y), right = Math.max(a.x, b.x), bottom = Math.max(a.y, b.y);
      return { left: left, top: top, right: right, bottom: bottom, width: right - left, height: bottom - top };
    };
    // how much the page is taller than the screen (0 = no scrolling needed)
    window.pageOverflow = function () {
      return window.ROTATION ? document.body.scrollHeight - document.body.clientHeight
                             : document.documentElement.scrollHeight - window.innerHeight;
    };
    function orient() {
      var p = window.viewW() < window.viewH();
      if (p !== root.classList.contains("portrait")) root.classList.toggle("portrait", p);
      // portrait: the box columns take a quarter of the width (200-290 px each), so the upright
      // chassis keeps its room also with Windows display scaling (125 %, 150 %)
      var n = p && window.viewW() < 800;      // narrow portrait page (e.g. 1080 px screen at 150 % scaling)
      if (n !== root.classList.contains("narrow")) root.classList.toggle("narrow", n);
      if (p) root.style.setProperty("--box-w", Math.round(Math.max(200, Math.min(290, window.viewW() * 0.25))) + "px");
      else root.style.removeProperty("--box-w");
    }
    orient();
    window.addEventListener("resize", orient);
    // a restarted (updated) dashboard reports a new version: reload to get the new pages
    window.APP_VERSION = root.getAttribute("data-version");
    window.checkVersion = function (v) { if (v && window.APP_VERSION && v !== window.APP_VERSION) location.reload(); };
    // hide the mouse pointer after 4 s without movement (standee / kiosk screen); moving the mouse shows it again
    var idle;
    function wake() {
      if (root.classList.contains("cursor-idle")) root.classList.remove("cursor-idle");
      clearTimeout(idle);
      idle = setTimeout(function () { root.classList.add("cursor-idle"); }, 4000);
    }
    document.addEventListener("mousemove", wake);
    document.addEventListener("mousedown", wake);
    wake();
  })();
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a href="{{ url_for('index') }}" class="brand-link" title="Home">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Company Logo" class="brand-logo"
           onerror="this.style.display='none'">
    </a>
    <div class="center-title">{% block center_title %}{% endblock %}</div>
    <div class="right-title">
      {% if demo_mode %}<span class="demo-badge">DEMO</span>{% endif %}
      {% if user %}
      <form method="post" action="{{ url_for('logout') }}" class="logout-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ request.path }}">
        <span class="user-name">&#128100; {{ user }}</span>
        <button type="submit" class="link-button">Log out</button>
      </form>
      {% else %}
      <a class="login-link" href="{{ url_for('login', next=request.path) }}">Manager login</a>
      {% endif %}
    </div>
  </header>

  <main class="content {% block content_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer-bar">
    <span>&copy; TMCVL Dharwad - Maintenance Team</span>
    <span class="conn {{ 'conn-ok' if db_ok else 'conn-down' }}" id="conn">
      <span class="conn-dot"></span><span id="conn-text">{{ 'Online' if db_ok else 'Offline' }}</span>
    </span>
  </footer>

  <script>
    // Use the real top bar / footer heights (they differ with screen scaling and fonts).
    (function () {
      function measureBars() {
        const root = document.documentElement.style;
        root.setProperty("--topbar-h", document.querySelector(".topbar").offsetHeight + "px");
        root.setProperty("--footer-h", document.querySelector(".footer-bar").offsetHeight + "px");
      }
      measureBars();
      window.addEventListener("resize", measureBars);
      window.addEventListener("load", measureBars);
    })();
  </script>

  {% block scripts %}{% endblock %}

  <!-- spa.js swaps .content / titles on navigation instead of a full reload. -->
  <script src="{{ url_for('static', filename='spa.js') }}"></script>
</body>
</html>
