{% extends "base.html" %}
{% block title %}Manager login{% endblock %}
{% block center_title %}Line Manager Login{% endblock %}

{% block content %}
<form method="post" action="{{ url_for('login') }}" class="login-card">
  <h2>Log in to edit circle positions</h2>
  {% if error %}<p class="login-error">{{ error }}</p>{% endif %}
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="next" value="{{ next_url }}">
  <label>Username <input name="username" autocomplete="username" required autofocus></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit" class="home-button">Log in</button>
</form>
{% endblock %}
