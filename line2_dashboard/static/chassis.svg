<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Truck chassis top view">
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a525c"/>
      <stop offset="0.5" stop-color="#20262d"/>
      <stop offset="1" stop-color="#3a4149"/>
    </linearGradient>
    <linearGradient id="tyre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3036"/>
      <stop offset="0.5" stop-color="#11151a"/>
      <stop offset="1" stop-color="#2b3036"/>
    </linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa3ad"/>
      <stop offset="0.45" stop-color="#e3e7eb"/>
      <stop offset="1" stop-color="#6f7882"/>
    </linearGradient>
    <pattern id="tread" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="url(#tyre)"/>
      <path d="M0 0 L5 10 M5 0 L10 10" stroke="#3d444c" stroke-width="2"/>
    </pattern>
    <g id="wheel">
      <rect x="-48" y="-22" width="96" height="44" rx="10" fill="url(#tread)"/>
      <rect x="-30" y="-14" width="60" height="28" rx="6" fill="#59616b"/>
      <circle r="8" fill="#c9ced4"/>
    </g>
    <g id="spring">
      <rect x="-70" y="-7" width="140" height="14" rx="7" fill="#5c646e"/>
      <path d="M-62 -2 H62 M-50 3 H50" stroke="#aab1b9" stroke-width="2"/>
    </g>
  </defs>

  <!-- driveline -->
  <rect x="300" y="152" width="700" height="16" rx="8" fill="#6b737c"/>
  <circle cx="560" cy="160" r="12" fill="#3a4149"/>
  <circle cx="800" cy="160" r="12" fill="#3a4149"/>

  <!-- axles -->
  <g fill="#3a4149">
    <rect x="178" y="50" width="24" height="220" rx="6"/>
    <rect x="858" y="50" width="24" height="220" rx="6"/>
    <rect x="988" y="50" width="24" height="220" rx="6"/>
  </g>
  <ellipse cx="870" cy="160" rx="34" ry="30" fill="#2c3238"/>
  <ellipse cx="1000" cy="160" rx="34" ry="30" fill="#2c3238"/>

  <!-- wheels -->
  <use href="#wheel" x="190" y="38"/>  <use href="#wheel" x="190" y="282"/>
  <use href="#wheel" x="870" y="38"/>  <use href="#wheel" x="870" y="282"/>
  <use href="#wheel" x="1000" y="38"/> <use href="#wheel" x="1000" y="282"/>

  <!-- side rails -->
  <rect x="70" y="96" width="1070" height="22" rx="4" fill="url(#rail)"/>
  <rect x="70" y="202" width="1070" height="22" rx="4" fill="url(#rail)"/>

  <!-- leaf springs -->
  <use href="#spring" x="190" y="107"/>  <use href="#spring" x="190" y="213"/>
  <use href="#spring" x="935" y="107"/>  <use href="#spring" x="935" y="213"/>

  <!-- cross members -->
  <g fill="#2a3037">
    <rect x="70" y="80" width="18" height="160" rx="4"/>
    <rect x="130" y="118" width="14" height="84"/>
    <rect x="430" y="118" width="16" height="84"/>
    <rect x="640" y="118" width="16" height="84"/>
    <rect x="760" y="118" width="16" height="84"/>
    <rect x="930" y="118" width="16" height="84"/>
    <rect x="1122" y="96" width="18" height="128" rx="4"/>
  </g>

  <!-- engine + gearbox -->
  <rect x="215" y="124" width="120" height="72" rx="10" fill="#4b545e"/>
  <g stroke="#7d8690" stroke-width="3">
    <path d="M232 132 V188 M252 132 V188 M272 132 V188 M292 132 V188 M312 132 V188"/>
  </g>
  <rect x="335" y="136" width="80" height="48" rx="12" fill="#5d6670"/>
  <rect x="150" y="128" width="50" height="64" rx="6" fill="#7a838d"/>

  <!-- battery box (top side) -->
  <rect x="470" y="46" width="110" height="48" rx="5" fill="#2e343b"/>
  <rect x="482" y="56" width="40" height="28" rx="3" fill="#5c646e"/>
  <rect x="528" y="56" width="40" height="28" rx="3" fill="#5c646e"/>

  <!-- fuel tank (bottom side) -->
  <rect x="455" y="228" width="170" height="48" rx="22" fill="url(#tank)" stroke="#59616b" stroke-width="2"/>
  <circle cx="600" cy="252" r="7" fill="#59616b"/>

  <!-- air tanks -->
  <rect x="680" y="230" width="120" height="30" rx="15" fill="url(#tank)" stroke="#59616b" stroke-width="2"/>
  <rect x="680" y="60" width="120" height="30" rx="15" fill="url(#tank)" stroke="#59616b" stroke-width="2"/>

  <!-- DEF / urea tank -->
  <rect x="330" y="232" width="90" height="40" rx="8" fill="#8fa8c2" stroke="#59616b" stroke-width="2"/>

  <!-- rear bumper hooks -->
  <rect x="1140" y="112" width="18" height="16" rx="3" fill="#2a3037"/>
  <rect x="1140" y="192" width="18" height="16" rx="3" fill="#2a3037"/>
</svg>
